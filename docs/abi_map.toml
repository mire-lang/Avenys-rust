# ABI Map — authoritative catalogue of LLVM symbols emitted by the MIR codegen.
#
# MIR no longer emits any @mire_* symbol. The codegen declares the symbols
# below (see src/compiler/mir/codegen/builtins.rs :: pal_extern_decls), which
# are implemented in C and linked per-build by clang. This file is the
# source of truth for tests/abi_consistency.rs, which asserts that every
# catalogued symbol is defined in its C source and (for pal_*) has a WASM stub.
#
# Fields per entry:
#   target    = LLVM symbol name (without the leading @)
#   category  = pal | runtime | ireru
#   impl      = C file that defines the symbol (linux/posix backend or runtime)
#   wasm      = true if a WASM stub must exist under src/pal/wasm

