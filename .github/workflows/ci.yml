name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-dev clang libssl-dev libsdl2-dev libsodium-dev

      - name: Checkout kioto (up-to-date Evelynx-Dev fork, PR #2 = v2.4.7)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/Kioto-1
          path: kioto-src
          ref: master

      - name: Setup kioto for tests
        run: cp -r kioto-src ../kioto

      - name: Checkout mire stdlib (Evelynx-Dev fork, needed by `load kioto`)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/mire-lib
          path: mire-src
          ref: main

      - name: Setup mire stdlib for tests
        run: cp -r mire-src ../mire

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Prepare artifact
        run: |
          mkdir -p dist/mire
          cp target/release/mire dist/mire/
          cp -r src/runtime dist/mire/runtime
          cp -r src/pal dist/mire/pal

      - name: Upload mire artifact
        uses: actions/upload-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire/
          retention-days: 7

  build-owl:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-dev clang libssl-dev libsdl2-dev libsodium-dev

      - name: Download mire artifact
        uses: actions/download-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire

      - name: Install mire and runtime
        run: |
          chmod +x dist/mire/mire
          sudo cp dist/mire/mire /usr/local/bin/mire
          sudo mkdir -p /usr/local/lib/mire
          if [ -d dist/mire/runtime ]; then
            sudo cp -r dist/mire/runtime /usr/local/lib/mire/
          fi
          if [ -d dist/mire/pal ]; then
            sudo cp -r dist/mire/pal /usr/local/lib/mire/
          fi
          mire --version || echo "mire installed"

      - name: Checkout kioto (up-to-date Evelynx-Dev fork, PR #2 = v2.4.7)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/Kioto-1
          path: kioto-src
          ref: master

      - name: Checkout owl source (up-to-date Evelynx-Dev fork, PR #14 = migrated namespaced API)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/owl
          path: owl-src
          ref: pr-0.27.0

      - name: Checkout mire stdlib (Evelynx-Dev fork; kioto `load kioto` transitivity)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/mire-lib
          path: mire-src
          ref: main

      - name: Setup owl dependencies
        run: |
          mkdir -p ~/.owl/modules
          cp -r kioto-src ~/.owl/modules/kioto
          cp -r kioto-src ./kioto
          cp -r mire-src ../mire
          # owl-src/owl.toml hardcodes Evelyn's local kioto path; repoint to
          # the sibling checkout so `load kioto` resolves in CI.
          sed -i 's|"/home/Evelyn/.owl/libs/kioto"|"../kioto"|' owl-src/owl.toml

      - name: Build owl
        working-directory: owl-src
        run: |
          mire build code/main.mire --release -O3 --no-analysis-cache

      - name: Test owl
        working-directory: owl-src
        run: |
          chmod +x bin/release/main
          ./bin/release/main -V
          echo "owl build successful"

      - name: Upload owl artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-linux-x86_64
          path: owl-src/bin/release/main
          retention-days: 7
