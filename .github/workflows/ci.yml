name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget ca-certificates pkg-config build-essential \
            libsodium-dev zlib1g-dev libzstd-dev libarchive-dev \
            zsh protobuf-compiler tcc libtcc-dev gcc
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq \
            llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Install pinned WASI SDK for PAL compile checks
        run: |
          wasi_sdk_archive="$RUNNER_TEMP/wasi-sdk-27.0-x86_64-linux.tar.gz"
          wget -q "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz" \
            -O "$wasi_sdk_archive"
          tar -xzf "$wasi_sdk_archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-27.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Compile PAL and runtime standard-stream modules for WASI
        run: ./scripts/test-wasi-runtime-compile.sh

      - name: Validate Owl/Avenys protocol schema
        run: ./scripts/validate-protocol-schema.sh "$RUNNER_TEMP/owl_avenys_schema.pb"

      - name: Test PAL Unix-domain sockets
        run: ./scripts/test-pal-unix-sockets.sh

      - name: Test standard input in the minimal runtime
        run: ./scripts/test-runtime-io.sh

      - name: Test runtime file helpers through PAL
        run: ./scripts/test-runtime-files.sh

      - name: Test controlling-terminal input through PAL
        run: ./scripts/test-runtime-tty.sh

      - name: Test runtime process helpers through PAL
        run: ./scripts/test-runtime-process.sh

      - name: Test runtime math allocation through PAL
        run: ./scripts/test-runtime-math-pal.sh

      - name: Test map container allocation through PAL
        run: ./scripts/test-runtime-maps-pal.sh

      - name: Test full-runtime raw string allocation through PAL
        run: ./scripts/test-runtime-managed-raw-pal.sh

      - name: Test CPU elapsed time through PAL
        run: ./scripts/test-runtime-cpu-time-pal.sh

      - name: Test minimal string helpers through PAL
        run: ./scripts/test-runtime-strings-minimal-pal.sh

      - name: Test Maybe and Result allocation through PAL
        run: ./scripts/test-runtime-mire-types-pal.sh

      - name: Test minimal managed strings through PAL allocation
        run: ./scripts/test-runtime-managed-minimal-pal.sh

      - name: Checkout kioto (active PR #3 branch = v2.5.0 namespaced net API)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/Kioto-1
          path: kioto-src
          ref: pr/2.5.0

      - name: Checkout mire stdlib (official mire-lang branch)
        uses: actions/checkout@v4
        with:
          repository: mire-lang/mire-lib
          path: mire-src
          ref: 2.0.0-beta

      - name: Setup local mire stdlib for tests
        run: |
          mkdir -p "$HOME/.owl/libs"
          cp -a "$GITHUB_WORKSPACE/mire-src" "$HOME/.owl/libs/mire"
          cp -a kioto-src "$HOME/.owl/libs/kioto"

      - name: Shim libsodium soname for prebuilt test fixtures
        run: |
          SOD=$(find /usr/lib -name 'libsodium.so.23' | head -1)
          if [ -n "$SOD" ]; then
            sudo ln -sfn "$SOD" "${SOD%.23}.26"
            ls -l "${SOD%.23}.26"
          else
            echo "warning: libsodium.so.23 not found; fixtures may fail to link"
          fi

      - name: Build
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo build --release

      - name: Test
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo test --release -j 2

      - name: Create sandbox tool-home fixture
        # tests/FFI/mod.mire pins /home/Evelyn/.owl because the grant stores a
        # resolved path and the fixture must exist. Create it on the runner.
        run: sudo mkdir -p /home/Evelyn/.owl

      - name: Run modular Mire tests
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: |
          rm -rf "$HOME/.owl/libs" /tmp/avenys-tests-cache
          mkdir -p "$HOME/.owl/libs"
          cp -a kioto-src "$HOME/.owl/libs/kioto"
          cp -a mire-src "$HOME/.owl/libs/mire"
          ./target/release/mire test tests -j 8 --release --log \
            --lib-dir "$HOME/.owl/libs" --cache-dir /tmp/avenys-tests-cache

      - name: Verify Mire and Rust benchmark outputs
        env:
          MIRE_BIN: ${{ github.workspace }}/target/release/mire
          MIRE_BENCH_WORK: /tmp/avenys-bench
        run: MIRE_LIB_DIR="$HOME/.owl/libs" ./bench/run.sh verify

      - name: Run benchmarks
        env:
          MIRE_BIN: ${{ github.workspace }}/target/release/mire
          MIRE_BENCH_WORK: /tmp/avenys-bench
        run: |
          MIRE_LIB_DIR="$HOME/.owl/libs" ./bench/run.sh measure 2>&1 | tee bench-results.txt
          cat bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 7

      - name: Prepare artifact
        run: |
          mkdir -p dist/mire
          cp target/release/mire dist/mire/
          cp -r src/runtime dist/mire/runtime
          cp -r src/pal dist/mire/pal
          test -f dist/mire/runtime/core/strings.c
          test -f dist/mire/runtime/core/time.c
          test -f dist/mire/runtime/collections/map/maps.c
          test -f dist/mire/runtime/memory/allocator/managed.c
          test -f dist/mire/runtime/std/input/input.c
          test -f dist/mire/runtime/std/output/output.c
          test -f dist/mire/runtime/std/error/error.c

      - name: Upload mire artifact
        uses: actions/upload-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire/
          retention-days: 7

  build-owl:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget ca-certificates pkg-config libsodium-dev zlib1g-dev libzstd-dev \
            libarchive-dev tcc libtcc-dev gcc
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq \
            llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Download mire artifact
        uses: actions/download-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire

      - name: Install mire and runtime
        run: |
          chmod +x dist/mire/mire
          sudo cp dist/mire/mire /usr/local/bin/mire
          sudo mkdir -p /usr/local/lib/mire
          if [ -d dist/mire/runtime ]; then
            sudo cp -r dist/mire/runtime /usr/local/lib/mire/
          fi
          if [ -d dist/mire/pal ]; then
            sudo cp -r dist/mire/pal /usr/local/lib/mire/
          fi
          mire --version || echo "mire installed"

      - name: Checkout kioto (active PR #3 branch = v2.5.0 namespaced net API)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/Kioto-1
          path: kioto-src
          ref: pr/2.5.0

      - name: Checkout owl source (active PR #16 branch, in the official repo)
        uses: actions/checkout@v4
        with:
          repository: mire-lang/owl
          path: owl-src
          ref: pr/1.2.0

      - name: Checkout mire stdlib (mire@2.0.0-beta, PAL bindings + nested namespaces)
        uses: actions/checkout@v4
        with:
          repository: mire-lang/mire-lib
          path: mire
          ref: 2.0.0-beta

      - name: Setup owl dependencies
        run: |
          mkdir -p ~/.owl/modules ~/.owl/libs
          cp -r kioto-src ~/.owl/modules/kioto
          cp -a kioto-src ~/.owl/libs/kioto
          cp -a mire ~/.owl/libs/mire
          cp -r kioto-src ./kioto
          # owl 1.2.4 declares its deps with `~`-relative paths, and this job
          # builds through a generated config that carries no [dependencies],
          # so `load kioto` / `load mire` resolve from --lib-dir (~/.owl/libs)
          # rather than from owl-src/owl.toml. No path rewriting is needed.

      - name: Generate avenys config for the owl build
        run: |
          cat > owl-src/native/mire-config.toml <<'EOF'
          [project]
          name = "owl"
          version = "1.2.4"
          entry = "code/main.mire"

          [build]
          profile = "release"
          opt-level = 3
          artifact = "bin"
          runtime = "minimal"
          target = "x86_64-unknown-linux-gnu"

          [paths]
          bin = "${{ github.workspace }}/owl-src/bin"
          cache = "/tmp/owl-archive-cache"

          [cfg]
          libs = ["archive", "zstd"]
          sources = ["native/archive.c"]
          link-dirs = []
          cflags = ["-Wl,--disable-new-dtags", "-Wl,-rpath,$ORIGIN/../lib/mire"]
          EOF

      - name: Build owl
        working-directory: owl-src
        run: |
          mire build code/main.mire --release -O3 --no-analysis-cache --config native/mire-config.toml --lib-dir "$HOME/.owl/libs"

      - name: Test owl
        working-directory: owl-src
        run: |
          chmod +x bin/main
          ./bin/main -V
          echo "owl build successful"

      - name: Upload owl artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-linux-x86_64
          path: owl-src/bin/main
          retention-days: 7
