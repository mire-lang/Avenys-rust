name: Release

on:
  push:
    tags:
      - "v*"
      - "B*"

permissions:
  contents: write

# Produces, for every pushed release tag:
#   mire-compiler-<triple>.tar.gz   compiler/{mire,runtime,pal} + .sha256
# for <triple> in x86_64-unknown-linux-gnu (amd64), aarch64-unknown-linux-gnu
# (arm64). riscv64-unknown-linux-gnu is compatible but problematic from precompilation;
# it must be built and installed by hand (no automated CI publishing).
# Automated riscv64 builds have been removed from CI/CD.

jobs:
  validate-protocol:
    name: Validate Owl/Avenys protocol schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install schema validation dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Validate frozen schema
        run: ./scripts/validate-protocol-schema.sh "$RUNNER_TEMP/owl_avenys_schema.pb"

  compiler:
    name: compiler (${{ matrix.triple }})
    needs: validate-protocol
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget ca-certificates pkg-config \
            libsodium-dev zlib1g-dev libzstd-dev libarchive-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build mire (${{ matrix.triple }})
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo build --release

      - name: Verify compiler version matches release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(target/release/mire --version)"
          printf 'Expected tag version: %s\\nCompiler reports: %s\\n' "$expected" "$actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "Compiler version does not match release tag" >&2; exit 1 ;;
          esac

      - name: Package compiler tarball (${{ matrix.triple }})
        run: |
          mkdir -p dist/compiler
          cp target/release/mire dist/compiler/mire
          cp -r src/runtime dist/compiler/runtime
          cp -r src/pal dist/compiler/pal
          test -f dist/compiler/runtime/core/strings.c
          test -f dist/compiler/runtime/core/time.c
          test -f dist/compiler/runtime/collections/map/maps.c
          test -f dist/compiler/runtime/memory/allocator/managed.c
          test -f dist/compiler/runtime/std/input/input.c
          test -f dist/compiler/runtime/std/output/output.c
          test -f dist/compiler/runtime/std/error/error.c
          cd dist
          tar czf ../mire-compiler-${{ matrix.triple }}.tar.gz compiler/
          cd ..
          sha256sum mire-compiler-${{ matrix.triple }}.tar.gz > mire-compiler-${{ matrix.triple }}.sha256

      - name: Upload compiler tarball
        uses: actions/upload-artifact@v4
        with:
          name: mire-compiler-${{ matrix.triple }}
          path: |
            mire-compiler-${{ matrix.triple }}.tar.gz
            mire-compiler-${{ matrix.triple }}.sha256

  release:
    name: Create Release
    needs: compiler
    if: always() && needs.compiler.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tarballs and checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 2>/dev/null | sort > SHASUMS.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Build ${{ github.ref_name }}"
          body_path: README.md
          files: dist/*
